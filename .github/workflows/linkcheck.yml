name: Nightly Link Check + README Stamp

on:
  schedule:
    - cron: "0 3 * * *"   # 03:00 UTC, nightly
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  linkcheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Prepare report directory
        run: mkdir -p lychee

      # Optional but recommended: cache to reduce rate limits/timeouts
      - name: Restore lychee cache
        uses: actions/cache@v6
        with:
          path: .lycheecache
          key: cache-lychee-${{ github.sha }}
          restore-keys: cache-lychee-

      - name: Run lychee (link checker)
        id: lychee
        uses: lycheeverse/lychee-action@v2
        env:
          LYCHEE_ROOT: ${{ github.workspace }}
        with:
          # CLI args only; DO NOT put format/output here.
          # --root-dir must be absolute (lychee rejects "--base ."); mail links
          # are excluded by default in lychee >= 0.18.
          args: >-
            --root-dir "${LYCHEE_ROOT}"
            --cache --max-cache-age 1w
            --no-progress
            --max-concurrency 8
            --retry-wait-time 2
            --timeout 20
            --accept 200,206,301,302,308
            --exclude-path RETIRED_LINKS.md
            .
          # Action inputs for report emission
          format: json
          output: lychee/out.json
          jobSummary: false               # json output; markdown-only summary N/A
          failIfEmpty: false
          fail: false                     # don't fail the job on broken links
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Save lychee cache
        if: always()
        uses: actions/cache/save@v6
        with:
          path: .lycheecache
          key: ${{ steps.lychee.outputs.cache-primary-key || format('cache-lychee-{0}', github.sha) }}

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Update README
        run: |
          python .github/scripts/stamp_readme.py \
            --report lychee/out.json \
            --readme README.md \
            --marker "last_verified_all"

      # main is protected by org rules (DCO check + verified signatures), so
      # the stamp goes through a PR: signed-off, API-signed commit on a fixed
      # branch, reusing the same PR every night.
      - name: Open or update stamp PR (only if README changed)
        uses: peter-evans/create-pull-request@v8
        with:
          add-paths: README.md
          commit-message: "docs: nightly link check stamp"
          signoff: true
          sign-commits: true
          branch: chore/linkcheck-stamp
          delete-branch: true
          title: "docs: nightly link check stamp"
          body: |
            Automated README stamp from the nightly link check.
            The lychee report is attached to the workflow run as `lychee-report`.

      # Optional: upload the report if it exists (no noisy warnings)
      - name: Upload lychee report (optional)
        if: ${{ always() && hashFiles('lychee/out.json') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: lychee-report
          path: lychee/out.json
